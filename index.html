<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
</head>
<body>
    <!-- Aviso de HTTPS removido para rodar perfeitamente no Vercel -->
    <div id="https-warning" style="display:none;"></div>

    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h2>GG Player</h2>
            <form id="login-form">
                <input type="text" id="user-input" placeholder="Usuário" required>
                <input type="password" id="pass-input" placeholder="Senha" required>
                <button type="submit" id="btn-login">
                    <span id="login-text">Entrar</span>
                    <span id="login-spinner" style="display:none;">Carregando...</span>
                </button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <header class="main-header">
            <div class="logo">GG Player</div>
            <div class="nav-tabs">
                <button class="tab-btn active" data-target="live">Ao Vivo</button>
                <button class="tab-btn" data-target="movies">Filmes</button>
                <button class="tab-btn" data-target="series">Séries</button>
                <button class="tab-btn" data-target="favorites">Favoritos</button>
                <button class="tab-btn" data-target="history">Histórico</button>
            </div>
            <div class="header-right">
                <input type="text" id="search-input" placeholder="Pesquisar...">
                <span id="expire-date"></span>
                <button id="btn-logout" class="btn-secondary">Sair</button>
            </div>
        </header>

        <div class="main-content">
            <div id="categories-panel" class="categories-panel">
                <ul id="categories-list"></ul>
            </div>
            <div class="content-body">
                <div id="live-hero" class="live-hero" style="display:flex;">
                    <div class="hero-player-container">
                        <video id="mini-player" controls autoplay muted></video>
                    </div>
                    <div class="hero-info">
                        <h2 id="hero-title">Selecione um canal</h2>
                        <button id="btn-fullscreen" class="btn-primary" style="display:none;">Tela Cheia</button>
                    </div>
                </div>
                <div id="content-grid" class="content-grid" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div id="details-screen" class="screen">
        <button id="btn-close-details" class="btn-back">&larr; Voltar</button>
        <div class="details-container">
            <img id="details-poster" src="" alt="Poster">
            <div class="details-info">
                <h1 id="details-title"></h1>
                <div class="meta-info">
                    <span id="details-year"></span>
                    <span id="details-rating"></span>
                </div>
                <p id="details-plot"></p>
                <div class="actions">
                    <button id="btn-play-vod" class="btn-primary">&#9654; Assistir</button>
                    <button id="btn-fav-vod" class="btn-secondary">&#9734; Favoritar</button>
                </div>
                <div id="series-episodes-container" style="display:none; margin-top:20px;">
                    <select id="season-select"></select>
                    <div id="episodes-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="player-screen" class="screen">
        <button id="btn-close-player" class="btn-back">&larr; Voltar</button>
        <video id="main-player" controls autoplay></video>
    </div>

    <script src="app.js"></script>
</body>
</html>
